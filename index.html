<body>
  <h1>ניווט מהיר</h1>
  <div style="font-size:12px;color:#999;margin-top:-14px;margin-bottom:14px">גרסה 2026-08-24 06:25</div>

  <div id="cropOverlay" style="display:none;position:fixed;top:0;left:0;right:0;height:100vh;height:100dvh;background:#000;z-index:1000;flex-direction:column;align-items:center;justify-content:flex-start;padding:10px;overflow-y:auto;box-sizing:border-box">
    <div style="color:#fff;font-size:13px;text-align:center;margin-bottom:6px;flex-shrink:0">גררו מלבן סביב האזור שרוצים לקרוא (למשל השם והכתובת ליד הסיכה)</div>

      <button id="cropFullBtn" style="height:40px;border:none;border-radius:10px;background:#555;color:#fff;font-size:14px">עבד את כל התמונה</button>

    </div>
  </div>

  <div class="hint">הוסיפו את הדף הזה למסך הבית לגישה מהירה</div>

<script>
function base64UrlToJson(str) {
  let s = str.replace(/-/g, '+').replace(/_/g, '/');
  while (s.length % 4) s += '=';
  const decoded = atob(s);
  return JSON.parse(decoded);
}

// Detects a route link with both an origin ("from") and destination ("to"),
// e.g. dgis://.../from/LON,LAT/to/LON,LAT (seen in Wolt's in-app navigate errors).
function extractFromTo(raw) {
  // Strip all whitespace/newlines first - OCR often line-wraps mid-number
  // (e.g. "34" then a newline then ".9065911"), which would otherwise break the match.
  raw = raw.replace(/\s+/g, '');
  const m = raw.match(/from\/(-?\d{1,3}\.\d+)[,\/](-?\d{1,3}\.\d+)\/t[o0]\/(-?\d{1,3}\.\d+)[,\/](-?\d{1,3}\.\d+)/i);
  if (m) {
    // Keep the original digit strings as-is (no rounding) - Wolt's links don't
    // always use the same number of decimal places for every point.
    return {
      from: { lat: m[2], lng: m[1] },
      to: { lat: m[4], lng: m[3] }
    };
  }
  return null;
}

function extractCoords(raw) {
  // Strip all whitespace/newlines first - OCR often line-wraps mid-number.
  raw = raw.replace(/\s+/g, '');

  // Case 1: plain "lat, lng"
  const plainMatch = raw.match(/^(-?\d{1,3}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)$/);
  if (plainMatch) {
    return { lat: plainMatch[1], lng: plainMatch[2] };
  }

  // Case 2: URL with lat/lng-ish query params (google maps, waze, etc.)
  const llMatch = raw.match(/[?&](?:ll|q|query)=(-?\d{1,3}\.\d+)[,%2C]+(-?\d{1,3}\.\d+)/i);
  if (llMatch) {
    return { lat: llMatch[1], lng: llMatch[2] };
  }

  // Case 3: HERE share link with base64 payload after /p/e-
  const hereMatch = raw.match(/\/p\/e-([A-Za-z0-9_-]+)/);
  if (hereMatch) {
    try {
      const data = base64UrlToJson(hereMatch[1]);
      if (data.latitude !== undefined && data.longitude !== undefined) {
        return { lat: String(data.latitude), lng: String(data.longitude) };
      }
    } catch (e) { /* fall through */ }
  }

  // Case 3b: nav-app deep links with only a to/LON,LAT (destination-only, no origin found)
  const toMatch = raw.match(/\bt[o0]\/(-?\d{1,3}\.\d+)[,\/](-?\d{1,3}\.\d+)/i);
  if (toMatch) {
    return { lat: toMatch[2], lng: toMatch[1] };
  }

  // Case 4: any two decimal numbers found anywhere in the text
  const anyMatch = raw.match(/(-?\d{1,3}\.\d{3,})[^\d-]+(-?\d{1,3}\.\d{3,})/);
  if (anyMatch) {
    return { lat: anyMatch[1], lng: anyMatch[2] };
  }

  return null;
}

function buildLinksFromCoords(lat, lng) {
  return {
    waze: 'https://waze.com/ul?ll=' + lat + ',' + lng + '&navigate=yes',
    gmaps: 'https://www.google.com/maps/search/?api=1&query=' + lat + ',' + lng,
    amaps: 'https://maps.apple.com/?ll=' + lat + ',' + lng + '&q=' + lat + ',' + lng
  };
}

function buildLinksFromAddress(address) {
  const enc = encodeURIComponent(address);
  return {
    waze: 'https://waze.com/ul?q=' + enc + '&navigate=yes',
    gmaps: 'https://www.google.com/maps/search/?api=1&query=' + enc,
    amaps: 'https://maps.apple.com/?q=' + enc
  };
}

// Rough sanity check: is this point somewhere near Israel?
// Catches classic OCR digit-swap errors (e.g. reading "3" as "5") that would
// otherwise silently send the driver to the wrong continent.
function isPlausibleIsrael(lat, lng) {
  if (lat === undefined || lng === undefined) return true; // not a coordinate - nothing to check
  return lat >= 29 && lat <= 34 && lng >= 33 && lng <= 36;
}

async function showResultOnMap(label, lat, lng, addressText) {
  const errorOut = document.getElementById('errorOut');
  let destLat = lat;
  let destLng = lng;

  if (destLat === undefined || destLng === undefined || isNaN(destLat) || isNaN(destLng)) {
    // Address-only - geocode the address text first
    errorOut.textContent = 'מאתר את הכתובת על המפה…';
    try {
      const resp = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(addressText));
      const results = await resp.json();
      if (results && results.length) {
        destLat = parseFloat(results[0].lat);
        destLng = parseFloat(results[0].lon);
      } else {
        errorOut.textContent = 'לא הצלחתי לאתר את הכתובת על המפה';
        return;
      }
    } catch (e) {
      errorOut.textContent = 'שגיאה באיתור הכתובת על המפה';
      return;
    }
  }

  errorOut.textContent = '';
  try {
    await showLiveMapToDestination(destLat, destLng, label);
    document.getElementById('mapContainer').scrollIntoView({ behavior: 'smooth', block: 'center' });
  } catch (e) {
    errorOut.textContent = 'שגיאה בטעינת המפה';
  }
}

function renderPointCard(label, coordsText, links, shareText, lat, lng) {
  const div = document.createElement('div');
  div.className = 'card links';
  const plausible = isPlausibleIsrael(lat, lng);
  const warning = plausible ? '' :
    '<div style="background:#fdecea;color:#c0392b;border-radius:8px;padding:8px;font-size:13px;text-align:center;margin-bottom:10px">' +
    '⚠️ הקואורדינטות האלה נראות מחוץ לישראל - כנראה טעות זיהוי (OCR). בדוק ידנית לפני שסומכים על זה!' +
    '</div>';
  div.innerHTML =
    '<div class="point-label">' + label + '</div>' +
    '<div class="coords" style="margin:0 0 10px">' + coordsText + '</div>' +
    warning +
    '<a class="waze" href="' + links.waze + '">Waze</a>' +
    '<a class="gmaps" href="' + links.gmaps + '">Google Maps</a>' +
    '<a class="amaps" href="' + links.amaps + '">Apple Maps</a>' +
    '<button class="primary map-btn" style="background:#673ab7">🗺️ הצג במפה (עדכון חי)</button>' +
    '<button class="primary share-btn" style="background:#555">שתף מיקום</button>';

  div.querySelector('.share-btn').addEventListener('click', async () => {
    if (navigator.share) {
      try { await navigator.share({ title: label, text: shareText, url: links.gmaps }); } catch (e) { /* cancelled */ }
    } else {
      document.getElementById('errorOut').textContent = 'שיתוף לא נתמך בדפדפן הזה';
    }
  });

  div.querySelector('.map-btn').addEventListener('click', () => {
    showResultOnMap(label, lat, lng, shareText);
  });

  return div;
}

// Removes common Hebrew filler words that carry no location info and can
// confuse address parsing/geocoding (e.g. "רחוב", "הרחוב", "כתובת:").
function stripAddressNoiseWords(text) {
  const noiseWords = ['ברחוב', 'הרחוב', 'רחוב', "רח'", 'רח׳', 'כתובת:', 'כתובת', 'מיקום:', 'מיקום'];
  let cleaned = text;
  noiseWords.forEach((w) => {
    cleaned = cleaned.split(w).join(' ');
  });
  return cleaned.replace(/\s+/g, ' ').trim();
}

function processText(raw, autoOpen) {
  const errorOut = document.getElementById('errorOut');
  const resultsBox = document.getElementById('resultsBox');

  errorOut.textContent = '';
  resultsBox.innerHTML = '';

  if (!raw || !raw.trim()) {
    errorOut.textContent = 'הדביקו קישור או קואורדינטות קודם';
    return null;
  }

  raw = stripAddressNoiseWords(raw);
  if (!raw) {
    errorOut.textContent = 'לא נשאר תוכן לעיבוד אחרי הניקוי';
    return null;
  }

  // Try origin+destination pair first (e.g. Wolt's route link with from/ and to/)
  const pair = extractFromTo(raw);
  if (pair) {
    // Use the raw digit strings exactly as found - no rounding - since Wolt
    // doesn't always use the same number of decimal places for every point.
    const fromLat = pair.from.lat;
    const fromLng = pair.from.lng;
    const toLat = pair.to.lat;
    const toLng = pair.to.lng;

    const fromLinks = buildLinksFromCoords(fromLat, fromLng);
    const toLinks = buildLinksFromCoords(toLat, toLng);

    resultsBox.appendChild(renderPointCard('📍 מאיפה', fromLat + ', ' + fromLng, fromLinks, fromLat + ', ' + fromLng, parseFloat(fromLat), parseFloat(fromLng)));
    resultsBox.appendChild(renderPointCard('🏁 לאן', toLat + ', ' + toLng, toLinks, toLat + ', ' + toLng, parseFloat(toLat), parseFloat(toLng)));
    // The destination is the more useful point to auto-show on the map
    return { label: '🏁 לאן', lat: parseFloat(toLat), lng: parseFloat(toLng) };
  }

  // Single point
  const result = extractCoords(raw);
  if (result) {
    const lat = result.lat;
    const lng = result.lng;
    const links = buildLinksFromCoords(lat, lng);
    resultsBox.appendChild(renderPointCard('📍 מיקום', lat + ', ' + lng, links, lat + ', ' + lng, parseFloat(lat), parseFloat(lng)));
    return { label: '📍 מיקום', lat: parseFloat(lat), lng: parseFloat(lng) };
  }

  // Fallback: plain address text
  const address = raw.trim();
  const links = buildLinksFromAddress(address);
  resultsBox.appendChild(renderPointCard('📍 כתובת', address, links, address));
  return { label: '📍 כתובת', address: address };
}

document.getElementById('parseBtn').addEventListener('click', async () => {
  const inputEl = document.getElementById('input');
  const errorOut = document.getElementById('errorOut');

  errorOut.textContent = '';

  if (navigator.clipboard && navigator.clipboard.readText) {
    try {
      const clip = await navigator.clipboard.readText();
      if (clip && clip.trim()) {
        inputEl.value = clip.trim();
      }
    } catch (e) { /* clipboard permission denied, fall back to whatever is typed */ }
  }

  processText(inputEl.value);
});

document.getElementById('manualBtn').addEventListener('click', async () => {
  const inputEl = document.getElementById('input');
  const result = processText(inputEl.value);
  if (result) {
    await showResultOnMap(result.label, result.lat, result.lng, result.address);
  }
});

document.getElementById('pickImageBtn').addEventListener('click', () => {
  document.getElementById('fileInput').click();
});

document.getElementById('cameraBtn').addEventListener('click', () => {
  document.getElementById('cameraInput').click();
});

function startVoiceRecognition() {
  const errorOut = document.getElementById('errorOut');
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    errorOut.textContent = 'זיהוי קולי לא נתמך בדפדפן הזה';
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = 'he-IL';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  errorOut.textContent = '🎤 מקשיב… דבר עכשיו';
  document.getElementById('resultsBox').innerHTML = '';

  recognition.onresult = (event) => {
    const transcript = event.results[0][0].transcript;
    document.getElementById('input').value = transcript;
    errorOut.textContent = '';
    processText(transcript);
  };

  recognition.onerror = (event) => {
    errorOut.textContent = 'שגיאה בזיהוי קולי: ' + event.error;
  };

  recognition.onend = () => {
    if (errorOut.textContent === '🎤 מקשיב… דבר עכשיו') {
      errorOut.textContent = '';
    }
  };

  try {
    recognition.start();
  } catch (e) {
    errorOut.textContent = 'לא ניתן להפעיל זיהוי קולי כרגע';
  }
}

document.getElementById('micBtn').addEventListener('click', startVoiceRecognition);

// Launched from the "הקלטה קולית" home-screen shortcut - jump straight into voice mode.
// Only on the initial page load, so switching to another app and back doesn't
// re-trigger listening unexpectedly. If a repeat tap on the icon doesn't reload
// the page, just tap the mic button below manually.
if (new URLSearchParams(window.location.search).get('action') === 'voice') {
  window.addEventListener('load', () => {
    setTimeout(startVoiceRecognition, 300);
  });
}

let cropCurrentFile = null;
let cropDragging = false;
let cropStartX = 0;
let cropStartY = 0;

function openCropOverlay(file) {
  cropCurrentFile = file;
  const img = document.getElementById('cropImage');
  const rect = document.getElementById('cropRect');
  rect.style.display = 'none';
  const url = URL.createObjectURL(file);
  img.onload = () => { URL.revokeObjectURL(url); };
  img.src = url;
  document.getElementById('cropOverlay').style.display = 'flex';
}

function closeCropOverlay() {
  document.getElementById('cropOverlay').style.display = 'none';
  cropCurrentFile = null;
}

function setupCropDragHandlers() {
  const wrapper = document.getElementById('cropWrapper');
  const rectEl = document.getElementById('cropRect');

  function getPoint(evt) {
    const bounds = wrapper.getBoundingClientRect();
    return { x: evt.clientX - bounds.left, y: evt.clientY - bounds.top };
  }

  wrapper.addEventListener('pointerdown', (evt) => {
    cropDragging = true;
    const p = getPoint(evt);
    cropStartX = p.x;
    cropStartY = p.y;
    rectEl.style.left = p.x + 'px';
    rectEl.style.top = p.y + 'px';
    rectEl.style.width = '0px';
    rectEl.style.height = '0px';
    rectEl.style.display = 'block';
    wrapper.setPointerCapture(evt.pointerId);
  });

  wrapper.addEventListener('pointermove', (evt) => {
    if (!cropDragging) return;
    const p = getPoint(evt);
    const x = Math.min(p.x, cropStartX);
    const y = Math.min(p.y, cropStartY);
    const w = Math.abs(p.x - cropStartX);
    const h = Math.abs(p.y - cropStartY);
    rectEl.style.left = x + 'px';
    rectEl.style.top = y + 'px';
    rectEl.style.width = w + 'px';
    rectEl.style.height = h + 'px';
  });

  wrapper.addEventListener('pointerup', () => { cropDragging = false; });
  wrapper.addEventListener('pointercancel', () => { cropDragging = false; });
}

setupCropDragHandlers();

async function cropToBlob(imgEl, rectEl) {
  const displayedRect = rectEl.getBoundingClientRect();
  const imgRect = imgEl.getBoundingClientRect();
  const scaleX = imgEl.naturalWidth / imgRect.width;
  const scaleY = imgEl.naturalHeight / imgRect.height;

  const sx = (displayedRect.left - imgRect.left) * scaleX;
  const sy = (displayedRect.top - imgRect.top) * scaleY;
  const sw = displayedRect.width * scaleX;
  const sh = displayedRect.height * scaleY;

  const canvas = document.createElement('canvas');
  canvas.width = sw;
  canvas.height = sh;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(imgEl, sx, sy, sw, sh, 0, 0, sw, sh);
  return new Promise((resolve) => canvas.toBlob((b) => resolve(b), 'image/png'));
}

document.getElementById('cropConfirmBtn').addEventListener('click', async () => {
  const rectEl = document.getElementById('cropRect');
  const imgEl = document.getElementById('cropImage');

  if (rectEl.style.display === 'none' || parseFloat(rectEl.style.width) < 10) {
    document.getElementById('errorOut').textContent = 'סמנו קודם מלבן על התמונה';
    return;
  }

  const blob = await cropToBlob(imgEl, rectEl);
  closeCropOverlay();
  try {
    await runOcrOnImage(blob);
  } catch (err) {
    document.getElementById('errorOut').textContent = 'שגיאה בקריאת הטקסט מהתמונה';
  }
});

document.getElementById('cropFullBtn').addEventListener('click', async () => {
  const file = cropCurrentFile;
  closeCropOverlay();
  if (!file) return;
  try {
    await runOcrOnImage(file);
  } catch (err) {
    document.getElementById('errorOut').textContent = 'שגיאה בקריאת הטקסט מהתמונה';
  }
});

document.getElementById('cropCancelBtn').addEventListener('click', closeCropOverlay);

document.getElementById('fileInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  openCropOverlay(file);
  e.target.value = '';
});

document.getElementById('cameraInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  openCropOverlay(file);
  e.target.value = '';
});

function applyCalibrationChange(delta) {
  userCalibrationOffset = ((userCalibrationOffset + delta) % 360 + 360) % 360;
  localStorage.setItem('navi_heading_calibration', String(userCalibrationOffset));
  if (myLocationMarker && naviMap) {
    myLocationMarker.setIcon(myLocationIcon(currentHeading()));
  }
  const debugEl = document.getElementById('headingDebug');
  if (debugEl && debugEl.textContent.indexOf('כיול') !== -1) {
    debugEl.textContent = debugEl.textContent.replace(/כיול: -?\d+°/, 'כיול: ' + userCalibrationOffset + '°');
  }
}

document.getElementById('calibMinus').addEventListener('click', () => applyCalibrationChange(-10));
document.getElementById('calibPlus').addEventListener('click', () => applyCalibrationChange(10));
document.getElementById('calibReset').addEventListener('click', () => {
  userCalibrationOffset = 0;
  localStorage.setItem('navi_heading_calibration', '0');
  if (myLocationMarker && naviMap) {
    myLocationMarker.setIcon(myLocationIcon(currentHeading()));
  }
});

let autoZoomEnabled = (localStorage.getItem('navi_auto_zoom') !== 'off');

function updateAutoZoomButton() {
  const btn = document.getElementById('autoZoomToggle');
  if (autoZoomEnabled) {
    btn.textContent = 'זום אוטומטי: פעיל 🔍';
    btn.style.background = '#34a853';
  } else {
    btn.textContent = 'זום אוטומטי: כבוי 🔒';
    btn.style.background = '#999';
  }
}

document.getElementById('autoZoomToggle').addEventListener('click', () => {
  autoZoomEnabled = !autoZoomEnabled;
  localStorage.setItem('navi_auto_zoom', autoZoomEnabled ? 'on' : 'off');
  updateAutoZoomButton();
});

updateAutoZoomButton();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = reject;
    document.head.appendChild(s);
  });
}

function loadStylesheet(href) {
  return new Promise((resolve, reject) => {
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = href;
    link.onload = resolve;
    link.onerror = reject;
    document.head.appendChild(link);
  });
}

let naviMap = null;
let myLocationMarker = null;
let destMarker = null;
let liveUpdateInterval = null;

function stopLiveUpdate() {
  if (liveUpdateInterval) {
    clearInterval(liveUpdateInterval);
    liveUpdateInterval = null;
  }
}

let compassHeading = null;
let compassListenerAdded = false;

// Fixed correction applied upstream (compass -180) plus a live, user-adjustable
// calibration offset the driver can tune with the +10°/-10° buttons, persisted
// across sessions since sensor behavior varies by device/session.
const ARROW_ROTATION_OFFSET = 0;
let userCalibrationOffset = parseFloat(localStorage.getItem('navi_heading_calibration') || '0') || 0;

function myLocationIcon(heading) {
  if (typeof heading === 'number' && !isNaN(heading)) {
    const displayHeading = ((heading + ARROW_ROTATION_OFFSET + userCalibrationOffset) % 360 + 360) % 360;
    return window.L.divIcon({
      className: '',
      html: '<div style="width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;' +
        'border-bottom:15px solid #4285F4;transform:rotate(' + displayHeading + 'deg);transform-origin:50% 85%;' +
        'filter:drop-shadow(0 0 2px white)"></div>',
      iconSize: [20, 20],
      iconAnchor: [10, 12]
    });
  }
  // No heading available yet - plain dot
  return window.L.divIcon({
    className: '',
    html: '<div style="width:14px;height:14px;background:#4285F4;border:2px solid white;border-radius:50%;box-shadow:0 0 4px rgba(0,0,0,0.5)"></div>',
    iconSize: [14, 14],
    iconAnchor: [7, 7]
  });
}

function currentHeading(gpsHeading) {
  if (typeof gpsHeading === 'number' && !isNaN(gpsHeading)) return gpsHeading;
  if (typeof compassHeading === 'number' && !isNaN(compassHeading)) return compassHeading;
  return null;
}

async function setupCompassListener() {
  if (compassListenerAdded) return;
  compassListenerAdded = true;

  // iOS requires an explicit permission prompt - harmless no-op on Android/Chrome.
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    try { await DeviceOrientationEvent.requestPermission(); } catch (e) { /* ignore */ }
  }

  const handler = (event) => {
    let rawHeading = null;
    if (typeof event.webkitCompassHeading === 'number') {
      rawHeading = event.webkitCompassHeading; // iOS: already compass-style, clockwise from North
    } else if (typeof event.alpha === 'number') {
      rawHeading = 360 - event.alpha; // convert to clockwise-from-North compass heading
    }
    if (rawHeading !== null && !isNaN(rawHeading)) {
      // The raw reading points to the back of the phone for this sensor orientation -
      // subtract 180° so the arrow follows the direction the front/top actually faces.
      const adjusted = ((rawHeading - 180) % 360 + 360) % 360;
      compassHeading = adjusted;

      const debugEl = document.getElementById('headingDebug');
      if (debugEl) {
        const displayed = ((adjusted + ARROW_ROTATION_OFFSET + userCalibrationOffset) % 360 + 360) % 360;
        debugEl.textContent = 'גולמי: ' + Math.round(rawHeading) + '° · חץ בפועל: ' + Math.round(displayed) + '° · כיול: ' + userCalibrationOffset + '°';
      }

      if (myLocationMarker && naviMap) {
        myLocationMarker.setIcon(myLocationIcon(currentHeading()));
      }
    }
  };

  if ('ondeviceorientationabsolute' in window) {
    window.addEventListener('deviceorientationabsolute', handler, true);
  } else {
    window.addEventListener('deviceorientation', handler, true);
  }
}

function destinationIcon() {
  return window.L.divIcon({
    className: '',
    html: '<div style="font-size:26px;line-height:26px">🏁</div>',
    iconSize: [26, 26],
    iconAnchor: [13, 26]
  });
}

// Just show my current location, no destination (used by the "המיקום שלי" button)
async function showMiniMap(lat, lng) {
  stopLiveUpdate();
  const mapContainer = document.getElementById('mapContainer');
  mapContainer.style.display = 'block';
  document.getElementById('distanceDisplay').style.display = 'none';
  document.getElementById('autoZoomToggle').style.display = 'none';

  if (!window.L) {
    await loadStylesheet('https://unpkg.com/leaflet@1.9.4/dist/leaflet.css');
    await loadScript('https://unpkg.com/leaflet@1.9.4/dist/leaflet.js');
  }

  if (naviMap) {
    naviMap.remove();
    naviMap = null;
    myLocationMarker = null;
    destMarker = null;
  }

  naviMap = window.L.map('mapContainer').setView([lat, lng], 16);
  window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(naviMap);
  myLocationMarker = window.L.marker([lat, lng], { icon: myLocationIcon(currentHeading()) }).addTo(naviMap).bindPopup('המיקום שלי');
  await setupCompassListener();
}

// Show a destination pin + my live location, refreshed every 5 seconds
// Distance in meters between two lat/lng points (haversine formula)
function distanceMeters(lat1, lng1, lat2, lng2) {
  const R = 6371000;
  const phi1 = lat1 * Math.PI / 180;
  const phi2 = lat2 * Math.PI / 180;
  const dPhi = (lat2 - lat1) * Math.PI / 180;
  const dLambda = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dPhi / 2) ** 2 + Math.cos(phi1) * Math.cos(phi2) * Math.sin(dLambda / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

function formatDistance(meters) {
  if (meters >= 1000) {
    return (meters / 1000).toFixed(1) + ' ק"מ ליעד';
  }
  return Math.round(meters) + ' מטר ליעד';
}

async function showLiveMapToDestination(destLat, destLng, label) {
  stopLiveUpdate();
  const mapContainer = document.getElementById('mapContainer');
  mapContainer.style.display = 'block';
  document.getElementById('distanceDisplay').style.display = 'block';
  document.getElementById('autoZoomToggle').style.display = 'block';

  if (!window.L) {
    await loadStylesheet('https://unpkg.com/leaflet@1.9.4/dist/leaflet.css');
    await loadScript('https://unpkg.com/leaflet@1.9.4/dist/leaflet.js');
  }

  if (naviMap) {
    naviMap.remove();
    naviMap = null;
    myLocationMarker = null;
    destMarker = null;
  }

  naviMap = window.L.map('mapContainer').setView([destLat, destLng], 15);
  window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(naviMap);

  destMarker = window.L.marker([destLat, destLng], { icon: destinationIcon() }).addTo(naviMap).bindPopup(label || 'יעד');

  await setupCompassListener();

  function updateMyLocation() {
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;
        // Prefer GPS-derived heading while actually moving; otherwise fall back to the compass
        const gpsHeading = (typeof pos.coords.heading === 'number' && !isNaN(pos.coords.heading) && pos.coords.speed > 0.5)
          ? pos.coords.heading : null;
        const heading = currentHeading(gpsHeading);

        if (myLocationMarker) {
          myLocationMarker.setLatLng([lat, lng]);
          myLocationMarker.setIcon(myLocationIcon(heading));
        } else {
          myLocationMarker = window.L.marker([lat, lng], { icon: myLocationIcon(heading) }).addTo(naviMap).bindPopup('המיקום שלי');
        }

        const dist = distanceMeters(lat, lng, destLat, destLng);

        const distanceEl = document.getElementById('distanceDisplay');
        if (distanceEl) {
          distanceEl.textContent = formatDistance(dist);
        }

        // Always keep both points framed in view (unless the driver turned this off
        // to pan/zoom freely), tightening the zoom as the distance shrinks.
        if (autoZoomEnabled) {
          const w = mapContainer.clientWidth || 300;
          const h = mapContainer.clientHeight || 220;
          const padX = w * 0.05;
          const padY = h * 0.05;
          naviMap.fitBounds(
            [[lat, lng], [destLat, destLng]],
            { paddingTopLeft: [padX, padY], paddingBottomRight: [padX, padY], maxZoom: 19 }
          );
        }
      },
      () => { /* keep showing last known position if this update fails */ },
      { enableHighAccuracy: true, timeout: 8000 }
    );
  }

  updateMyLocation();
  liveUpdateInterval = setInterval(updateMyLocation, 5000);
}


document.getElementById('myLocationBtn').addEventListener('click', () => {
  const errorOut = document.getElementById('errorOut');

  if (!navigator.geolocation) {
    errorOut.textContent = 'שירותי מיקום לא נתמכים בדפדפן הזה';
    return;
  }

  errorOut.textContent = 'מאתר מיקום…';
  document.getElementById('resultsBox').innerHTML = '';

  navigator.geolocation.getCurrentPosition(
    async (pos) => {
      errorOut.textContent = '';
      const lat = pos.coords.latitude.toFixed(7);
      const lng = pos.coords.longitude.toFixed(7);
      document.getElementById('input').value = lat + ', ' + lng;
      processText(lat + ', ' + lng);
      try {
        await showMiniMap(pos.coords.latitude, pos.coords.longitude);
      } catch (e) { /* map failed to load - the coordinate card still works fine */ }
    },
    (err) => {
      errorOut.textContent = 'לא ניתן לאתר מיקום: ' + err.message;
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
});

let ocrWorker = null;

// Upscale + grayscale + boost contrast before OCR. This makes similar-looking
// digits (like 3 vs 5) more distinguishable and generally improves accuracy.
async function preprocessImage(blob) {
  const bitmap = await createImageBitmap(blob);
  const scale = 2;
  const canvas = document.createElement('canvas');
  canvas.width = bitmap.width * scale;
  canvas.height = bitmap.height * scale;
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(bitmap, 0, 0, canvas.width, canvas.height);

  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const d = imageData.data;
  const contrast = 1.6;
  for (let i = 0; i < d.length; i += 4) {
    const gray = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
    let val = (gray - 128) * contrast + 128;
    val = Math.min(255, Math.max(0, val));
    d[i] = d[i + 1] = d[i + 2] = val;
  }
  ctx.putImageData(imageData, 0, 0);

  return new Promise((resolve) => canvas.toBlob((b) => resolve(b || blob), 'image/png'));
}

async function getOcrWorker() {
  if (ocrWorker) return ocrWorker;
  if (!window.Tesseract) {
    await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
  }
  ocrWorker = await window.Tesseract.createWorker('eng+heb');
  // Treat the image as one uniform block of text instead of trying to detect
  // columns/regions - this reduces the OCR scrambling the reading order on
  // simple screenshots like a dialog box.
  await ocrWorker.setParameters({ tessedit_pageseg_mode: window.Tesseract.PSM.SINGLE_BLOCK });
  return ocrWorker;
}

async function runOcrOnImage(blob) {
  const errorOut = document.getElementById('errorOut');
  document.getElementById('resultsBox').innerHTML = '';
  errorOut.textContent = 'משפר את איכות התמונה…';

  let processedBlob = blob;
  try {
    processedBlob = await preprocessImage(blob);
  } catch (e) { /* if preprocessing fails, fall back to the original image */ }

  errorOut.textContent = 'קורא טקסט מהתמונה…';
  const worker = await getOcrWorker();
  const { data } = await worker.recognize(processedBlob);
  errorOut.textContent = '';
  document.getElementById('input').value = data.text;
  processText(data.text, true);
}


(function handleSharedContent() {
  const params = new URLSearchParams(window.location.search);

  if (params.get('shared') === '1' && 'caches' in window) {
    (async () => {
      const cache = await caches.open('navi-share-v1');

      const imageResp = await cache.match('shared-image');
      if (imageResp) {
        const blob = await imageResp.blob();
        await cache.delete('shared-image');
        try {
          await runOcrOnImage(blob);
        } catch (e) {
          document.getElementById('errorOut').textContent = 'שגיאה בקריאת הטקסט מהתמונה';
        }
        return;
      }

      const textResp = await cache.match('shared-text');
      if (textResp) {
        const text = await textResp.text();
        await cache.delete('shared-text');
        document.getElementById('input').value = text;
        processText(text, true);
      }
    })();
    return;
  }

  const shared = [params.get('text'), params.get('url'), params.get('title')]
    .filter(Boolean)
    .join(' ');
  if (shared) {
    document.getElementById('input').value = shared;
    processText(shared, true);
  }
})();
</script>
